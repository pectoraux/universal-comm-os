name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scan

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: bun run lint

      # S0.2.4 — typecheck is now FATAL. Previously `continue-on-error: true`
      # allowed type drift to accumulate while tests passed. Removing the
      # continue-on-error makes typecheck a gate failure.
      - name: Typecheck (FATAL — was previously continue-on-error: true)
        run: npx tsc --noEmit

      # S0.2.4 — architecture tests are FATAL in CI too (not just in the gate script).
      - name: Architecture tests (FATAL)
        run: bun run test:arch

      - name: All tests
        run: bun run test

      # S0.2.4 — security tests split out as a FATAL subset of the architecture suite.
      - name: Security tests (FATAL)
        run: bun run vitest --run tests/architecture/s0-security.test.ts

      - name: Security — .env not in git history
        run: |
          if git log --all --oneline -- .env | head -1 | grep -q .; then
            echo "FAIL: .env found in git history"
            exit 1
          fi
          echo "PASS: .env not in git history"

      - name: Security — NEXTAUTH_SECRET fallback removed
        run: |
          if grep -q "dev-secret-change-in-production" src/lib/auth.ts; then
            echo "FAIL: NEXTAUTH_SECRET fallback found"
            exit 1
          fi
          echo "PASS: NEXTAUTH_SECRET fallback removed"

      - name: Security — every server action auth-guarded
        run: |
          COUNT=$(grep -c "withAuth\|withRole" src/app/actions/commos.ts || echo "0")
          if [ "$COUNT" -lt "1" ]; then
            echo "FAIL: No auth guards found in commos.ts"
            exit 1
          fi
          echo "PASS: $COUNT auth guards found"

      - name: Security — secret scan in tracked files
        run: |
          if git ls-files | xargs grep -rl "ghp_[a-zA-Z0-9]\{36\}\|vcp_[a-zA-Z0-9]\{40,\}" 2>/dev/null | head -1 | grep -q .; then
            echo "FAIL: Secrets found in tracked files"
            git ls-files | xargs grep -rl "ghp_[a-zA-Z0-9]\{36\}\|vcp_[a-zA-Z0-9]\{40,\}" 2>/dev/null
            exit 1
          fi
          echo "PASS: No secrets in tracked files"

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ci-artifacts/
          if-no-files-found: ignore

  # ─── S0.2.4 / Article XVI / ARCH-051 — Repository Truth Gate (PR_INTEGRITY) ──
  # Runs on pull_request events. Asserts the tested SHA equals the checked-out
  # github.sha. Does NOT require origin/main equality — the PR's commit has
  # not yet been merged into main.
  repo-truth-gate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      build_at_sha: ${{ steps.gate.outputs.BUILD_AT_SHA }}
      tested_at_sha: ${{ steps.gate.outputs.TESTED_AT_SHA }}
      architecture_at_sha: ${{ steps.gate.outputs.ARCHITECTURE_AT_SHA }}
      worktree_clean: ${{ steps.gate.outputs.WORKTREE_CLEAN }}
      match: ${{ steps.gate.outputs.MATCH }}
      mode: PR_INTEGRITY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Repository Truth Gate (PR_INTEGRITY mode)
        id: gate
        run: bash scripts/repo-truth-gate.sh PR_INTEGRITY "pr-${{ github.event.pull_request.number }}"

      - name: Gate summary
        if: always()
        run: |
          echo "## Repository Truth Gate — PR_INTEGRITY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** PR_INTEGRITY" >> $GITHUB_STEP_SUMMARY
          echo "**Checked-out SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "origin/main equality is **not** required in PR_INTEGRITY mode." >> $GITHUB_STEP_SUMMARY
          echo "The PR's commit is by definition not yet on main." >> $GITHUB_STEP_SUMMARY

  # ─── S0.2.4 / Article XVI / ARCH-051 — Repository Truth Gate (MAIN_MILESTONE) ──
  # Runs on push to main. Asserts the tested SHA equals BOTH the local HEAD
  # AND origin/main HEAD. This is the canonical "milestone complete" gate.
  repo-truth-gate-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      build_at_sha: ${{ steps.gate.outputs.BUILD_AT_SHA }}
      tested_at_sha: ${{ steps.gate.outputs.TESTED_AT_SHA }}
      architecture_at_sha: ${{ steps.gate.outputs.ARCHITECTURE_AT_SHA }}
      worktree_clean: ${{ steps.gate.outputs.WORKTREE_CLEAN }}
      match: ${{ steps.gate.outputs.MATCH }}
      mode: MAIN_MILESTONE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Repository Truth Gate (MAIN_MILESTONE mode)
        id: gate
        run: bash scripts/repo-truth-gate.sh MAIN_MILESTONE "push-${{ github.sha }}"

      - name: Gate summary
        if: always()
        run: |
          echo "## Repository Truth Gate — MAIN_MILESTONE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** MAIN_MILESTONE" >> $GITHUB_STEP_SUMMARY
          echo "**Local HEAD:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Required:** local HEAD == origin/main HEAD == tested SHA" >> $GITHUB_STEP_SUMMARY
