milestones:
  - id: M1
    name: First Technical Milestone
    description: >
      Encrypted Communication Bundle traverses
      ANDROID A → ANDROID B → ANDROID C → GATEWAY → MATRIX → WEB/ELECTRON.
      Destination distinguishes created → accepted → relayed → gateway reached → delivered → read.
    depends_on: [P7, P6, P5, P4]
    status: PENDING

invariants:
  - communication_is_transport_independent
  - identity_is_channel_independent
  - bundle_is_fundamental_routable_object
  - matrix_is_one_fabric_among_potentially_many
  - dtn_functions_without_internet_and_without_matrix
  - routing_over_capabilities_not_device_types
  - no_fake_implementations
  - architecture_tests_machine_enforce_boundaries
  - no_premature_complexity

forbidden_until_acp:
  - replacing_matrix
  - replacing_dtn
  - merging_architectural_layers
  - token_economy
  - ai_routing_authority
  - protocol_redesign
